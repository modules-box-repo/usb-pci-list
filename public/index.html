<!-- Main layout -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USB & PCI List</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="toolbar">
        <h1 class="title">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect>
                <rect x="9" y="9" width="6" height="6"></rect>
                <line x1="9" y1="1" x2="9" y2="4"></line>
                <line x1="15" y1="1" x2="15" y2="4"></line>
                <line x1="9" y1="20" x2="9" y2="23"></line>
                <line x1="15" y1="20" x2="15" y2="23"></line>
                <line x1="20" y1="9" x2="23" y2="9"></line>
                <line x1="20" y1="14" x2="23" y2="14"></line>
                <line x1="1" y1="9" x2="4" y2="9"></line>
                <line x1="1" y1="14" x2="4" y2="14"></line>
            </svg>
            USB & PCI List
        </h1>
        <button id="themeToggle" class="theme-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
        </button>
    </header>
    
    <div class="tabs-container">
        <button id="btnUsb" class="tab-btn active">USB Devices</button>
        <button id="btnPci" class="tab-btn">PCI Devices</button>
    </div>
    
    <main class="container">
        <!-- Fragment for USB -->
        <div id="fragUsb" class="fragment active">
            <div id="usbContainer" class="device-list">
                <div class="loading">Loading USB devices...</div>
            </div>
        </div>
        
        <!-- Fragment for PCI -->
        <div id="fragPci" class="fragment">
            <div id="pciContainer" class="device-list">
                <div class="loading">Loading PCI devices...</div>
            </div>
        </div>
    </main>

    <script src="/js/app.js"></script>
</body>
</html>
